name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-24.04

    steps:
    - name: Pull Repositorio
      uses: actions/checkout@v4
    - name: Build the Docker image
      run: docker build -t ruuuul1/calculadora:$(date +%s) .
